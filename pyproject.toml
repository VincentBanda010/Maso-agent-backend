[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "maso-api"
version = "1.0.0"
description = "Privacy-conscious phishing analysis API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "aiohttp>=3.12,<4", "python-multipart>=0.0.22,<1", "opencv-python-headless>=4.11,<6", "pillow>=11,<14"]

[project.optional-dependencies]
ai = ["transformers>=5,<6", "torch>=2.6,<3"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "qrcode>=8,<9"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
